name: Sawakli AI CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  documentation-governance:
    name: Documentation governance
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'documentation-exempt')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation governance
        run: bash .github/scripts/check-documentation-governance.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract validators and negative tests
        run: node scripts/run-contracts.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sawakli
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sawakli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Separate server for the migration round-trip: the 0007 downgrade drops cluster-wide
      # roles, which fails while another database on the same server still holds grants.
      postgres-roundtrip:
        image: postgres:18
        env:
          POSTGRES_DB: sawakli_roundtrip
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sawakli_roundtrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Prepare integration test database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sawakli_integration_test
        run: python ../../scripts/integration_harness.py fresh-db TEST_DATABASE_URL
      - name: Tests
        env:
          JWT_SECRET: change-this-to-a-real-secret
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sawakli
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sawakli_integration_test
        # A skipped test is a test that did not run: fail the job if any test is skipped.
        run: |
          pytest -rs --junitxml=pytest-results.xml
          python -c "import sys, xml.etree.ElementTree as ET; s = sum(int(t.get('skipped', 0)) for t in ET.parse('pytest-results.xml').getroot().iter('testsuite')); print(f'skipped tests: {s}'); sys.exit(1 if s else 0)"
      - name: Migration round-trip (upgrade head, downgrade base, upgrade head)
        env:
          ROUNDTRIP_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/sawakli_roundtrip
        run: python ../../scripts/integration_harness.py roundtrip

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run database migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Start stack and wait for health checks
        run: docker compose up -d --wait

      - name: Verify service health
        run: |
          docker compose ps
          test "$(docker inspect --format='{{.State.Health.Status}}' sawakli-postgres)" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' sawakli-api)" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' sawakli-worker)" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' sawakli-web)" = "healthy"

      - name: API smoke test
        run: curl --fail http://localhost:8000/health

      - name: Web to API smoke test
        run: docker exec sawakli-web wget -qO- http://api:8000/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
