[alembic]
script_location = alembic
prepend_sys_path = src

# Overridden in alembic/env.py from DATABASE_URL. Do not put real credentials here.
sqlalchemy.url = postgresql+psycopg://postgres:change-me@localhost:5433/sawakli

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s